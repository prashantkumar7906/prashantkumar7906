<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" style="background:#0E1525; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2438" />
      <stop offset="100%" stop-color="#0E1525" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFB347" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F6C667" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="blurGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="398" height="218" rx="24" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle glow in top right -->
  <circle cx="360" cy="40" r="25" fill="#FFB347" fill-opacity="0.06" filter="url(#blurGlow)" />

  <!-- Project Icon (IEEE Publication / Doc Grid) -->
  <g transform="translate(24, 24)" fill="#FF8A3D">
    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
  </g>

  <!-- Status indicator -->
  <g transform="translate(348, 24)">
    <rect x="-80" y="0" width="85" height="20" rx="10" fill="#111827" stroke="#FFB347" stroke-opacity="0.2" />
    <circle cx="-70" cy="10" r="3.5" fill="#FFB347" />
    <text x="-60" y="13" font-size="9" font-weight="700" fill="#D8DEE9">PUBLISHED</text>
  </g>

  <!-- Title -->
  <text x="24" y="80" font-size="18" font-weight="700" fill="#FFFFFF">IoT Driven Healthcare System</text>

  <!-- Description -->
  <text x="24" y="105" font-size="12" font-weight="400" fill="#D8DEE9" width="352">
    <tspan x="24" dy="0">IEEE publication outlining a secure microservices</tspan>
    <tspan x="24" dy="16">architecture for real-time remote telemetry streaming.</tspan>
  </text>

  <!-- Features list -->
  <text x="24" y="146" font-size="10" font-weight="700" fill="#FFB347" letter-spacing="0.5">IEEE RESEARCH • MICROSERVICES • CLOUD IOT</text>

  <!-- Tech pills -->
  <g transform="translate(24, 166)">
    <rect x="0" y="0" width="64" height="24" rx="8" fill="#2A1B15" stroke="#FF8A3D" stroke-opacity="0.3" stroke-width="1" />
    <text x="32" y="15" font-size="10" font-weight="700" fill="#FF8A3D" text-anchor="middle">Python</text>
    
    <rect x="72" y="0" width="54" height="24" rx="8" fill="#2A2115" stroke="#FFB347" stroke-opacity="0.3" stroke-width="1" />
    <text x="99" y="15" font-size="10" font-weight="700" fill="#FFB347" text-anchor="middle">Java</text>

    <rect x="134" y="0" width="82" height="24" rx="8" fill="#2A2515" stroke="#F6C667" stroke-opacity="0.3" stroke-width="1" />
    <text x="175" y="15" font-size="10" font-weight="700" fill="#F6C667" text-anchor="middle">AWS Cloud</text>

    <rect x="224" y="0" width="64" height="24" rx="8" fill="#212936" stroke="#475569" stroke-opacity="0.3" stroke-width="1" />
    <text x="256" y="15" font-size="10" font-weight="700" fill="#E5E7EB" text-anchor="middle">Docker</text>
  </g>
</svg>
