<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="850" height="280" style="background:#090d16; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c1b2d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid -->
  <path d="M 0 40 L 850 40 M 0 80 L 850 80 M 0 120 L 850 120 M 0 160 L 850 160 M 0 200 L 850 200 M 0 240 L 850 240" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
  <path d="M 100 0 L 100 280 M 200 0 L 200 280 M 300 0 L 300 280 M 400 0 L 400 280 M 500 0 L 500 280 M 600 0 L 600 280 M 700 0 L 700 280 M 800 0 L 800 280" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />

  <!-- Ambient Glows -->
  <circle cx="750" cy="140" r="80" fill="#6366f1" fill-opacity="0.15" filter="url(#glow)" />
  <circle cx="100" cy="240" r="60" fill="#a855f7" fill-opacity="0.1" filter="url(#glow)" />

  <!-- Abstract Geometry on the Right -->
  <g transform="translate(620, 70)">
    <!-- Outer Hexagon -->
    <polygon points="70,0 135,37.5 135,112.5 70,150 5,112.5 5,37.5" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.4" />
    
    <!-- Inner Glowing Hexagon -->
    <polygon points="70,15 120,44 120,101 70,130 20,101 20,44" fill="none" stroke="url(#monogramGrad)" stroke-width="1.5" stroke-opacity="0.8" filter="url(#subtleGlow)" />
    
    <!-- Connecting lines to monogram -->
    <line x1="70" y1="0" x2="70" y2="150" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="3,3" />
    <line x1="5" y1="37.5" x2="135" y2="112.5" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="3,3" />
    <line x1="5" y1="112.5" x2="135" y2="37.5" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="3,3" />

    <!-- Monogram Text: PK -->
    <text x="70" y="85" text-anchor="middle" font-size="36" font-weight="800" fill="url(#monogramGrad)" filter="url(#subtleGlow)">PK</text>
  </g>

  <!-- Left Content -->
  <g transform="translate(60, 0)">
    <!-- Greetings Badge -->
    <rect x="0" y="65" width="130" height="26" rx="13" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="15" cy="78" r="4" fill="#818cf8" />
    <text x="26" y="82" font-size="11" font-weight="600" fill="#a5b4fc" letter-spacing="1.5">HELLO WORLD</text>

    <!-- Main Title -->
    <text x="0" y="140" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="1">Prashant Kumar</text>
    
    <!-- Gradient accent bar under name -->
    <rect x="0" y="152" width="220" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitles / Roles -->
    <text x="0" y="190" font-size="18" font-weight="600" fill="#e2e8f0">Full Stack Engineer</text>
    
    <!-- Dots for separation -->
    <circle cx="185" cy="184" r="2.5" fill="#6366f1" />
    <text x="198" y="190" font-size="18" font-weight="600" fill="#e2e8f0">Corporate Trainer</text>
    
    <circle cx="370" cy="184" r="2.5" fill="#a855f7" />
    <text x="383" y="190" font-size="18" font-weight="600" fill="#e2e8f0">CS Graduate</text>

    <!-- Bio / Brand Statement -->
    <text x="0" y="222" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.5">Building high-performance applications, mentoring engineers, and deploying cloud architectures.</text>
  </g>
</svg>
