<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="850" height="280" style="background:#050814; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="50%" stop-color="#080f21" />
      <stop offset="100%" stop-color="#111629" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>
    
    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with Glowing Border -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="848" height="278" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.3" filter="url(#subtleGlow)" />
  
  <!-- Subtle Grid -->
  <path d="M 0 40 L 850 40 M 0 80 L 850 80 M 0 120 L 850 120 M 0 160 L 850 160 M 0 200 L 850 200 M 0 240 L 850 240" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />
  <path d="M 100 0 L 100 280 M 200 0 L 200 280 M 300 0 L 300 280 M 400 0 L 400 280 M 500 0 L 500 280 M 600 0 L 600 280 M 700 0 L 700 280 M 800 0 L 800 280" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />

  <!-- Ambient Glows -->
  <circle cx="700" cy="140" r="90" fill="#6366f1" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="150" cy="240" r="70" fill="#ec4899" fill-opacity="0.06" filter="url(#glow)" />

  <!-- Left Content -->
  <g transform="translate(60, 0)">
    <!-- Greetings Badge -->
    <rect x="0" y="65" width="130" height="26" rx="13" fill="#111827" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="15" cy="78" r="4.5" fill="#6366f1" />
    <text x="26" y="82" font-size="11" font-weight="600" fill="#a5b4fc" letter-spacing="1.5">HELLO WORLD</text>

    <!-- Main Title -->
    <text x="0" y="140" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="0.5">Prashant Kumar</text>
    
    <!-- Gradient accent bar under name -->
    <rect x="0" y="152" width="220" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitles / Roles -->
    <text x="0" y="190" font-size="18" font-weight="600" fill="#f1f5f9">Full Stack Engineer</text>
    
    <!-- Dots for separation -->
    <circle cx="185" cy="184" r="2.5" fill="#6366f1" />
    <text x="198" y="190" font-size="18" font-weight="600" fill="#f1f5f9">Corporate Trainer</text>
    
    <circle cx="370" cy="184" r="2.5" fill="#a855f7" />
    <text x="383" y="190" font-size="18" font-weight="600" fill="#f1f5f9">CS Graduate</text>

    <!-- Bio / Brand Statement -->
    <text x="0" y="222" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.5">Building high-performance applications, mentoring engineers, and deploying cloud architectures.</text>
  </g>

  <!-- Right Content: Minimalist Developer Terminal Mockup -->
  <g transform="translate(480, 50)">
    <!-- Terminal Box -->
    <rect width="310" height="180" rx="12" fill="url(#terminalBg)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Window Controls -->
    <circle cx="18" cy="18" r="5" fill="#ef4444" />
    <circle cx="32" cy="18" r="5" fill="#eab308" />
    <circle cx="46" cy="18" r="5" fill="#22c55e" />
    
    <!-- File Name Tab -->
    <rect x="70" y="8" width="100" height="20" rx="4" fill="#1e293b" fill-opacity="0.5" />
    <text x="120" y="22" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">prashant.ts</text>
    
    <!-- Code Editor Content (Monospace look) -->
    <g font-family="Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace" font-size="12" xml:space="preserve">
      <!-- Line 1: const developer = { -->
      <text x="20" y="60">
        <tspan fill="#c084fc">const</tspan> <tspan fill="#f1f5f9">developer</tspan> <tspan fill="#38bdf8">=</tspan> <tspan fill="#ffffff">{</tspan>
      </text>
      
      <!-- Line 2:   name: "Prashant Kumar", -->
      <text x="20" y="80">
        <tspan fill="#94a3b8">  name:</tspan> <tspan fill="#34d399">"Prashant Kumar"</tspan><tspan fill="#ffffff">,</tspan>
      </text>
      
      <!-- Line 3:   role: "Dev & Educator", -->
      <text x="20" y="100">
        <tspan fill="#94a3b8">  role:</tspan> <tspan fill="#34d399">"Dev &amp; Educator"</tspan><tspan fill="#ffffff">,</tspan>
      </text>
      
      <!-- Line 4:   cloud: ["Azure", "AWS"], -->
      <text x="20" y="120">
        <tspan fill="#94a3b8">  cloud:</tspan> <tspan fill="#ffffff">[</tspan><tspan fill="#38bdf8">"Azure"</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#38bdf8">"AWS"</tspan><tspan fill="#ffffff">],</tspan>
      </text>
      
      <!-- Line 5:   motto: "Discipline & Scale" -->
      <text x="20" y="140">
        <tspan fill="#94a3b8">  motto:</tspan> <tspan fill="#34d399">"Discipline &amp; Scale"</tspan>
      </text>
      
      <!-- Line 6: }; -->
      <text x="20" y="160">
        <tspan fill="#ffffff">};</tspan>
      </text>
    </g>
  </g>
</svg>
