name: Generate Snake

on:
  # Run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # Allows manual triggers via the Actions tab
  workflow_dispatch:
  
  # Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Checkout the repository so the deploy step can access it
      - name: Checkout
        uses: actions/checkout@v3

      # Generates a snake game from a github user's contributions graph, outputting SVG animations
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF8A3D&color_dots=%23ebedf0,%23FDE0D0,%23FDBA94,%23FB9057,%23FF8A3D
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F6C667&color_dots=%23161b22,%232A1B15,%235A2F1D,%23A34F25,%23FF8A3D
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Push the generated SVGs to the 'output' branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
